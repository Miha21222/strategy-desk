# Installer config. `npm run dist` builds a real NSIS installer for Windows;
# `npm run dist:dir` builds the unpacked directory only (fast, for debugging);
# `npm run dist:check` launches the packaged binary headlessly and fails if it
# cannot find its workflows, its rule book or the Claude binary.
appId: dev.strategydesk.app
productName: Strategy Desk
# Strategy-Desk-0.1.0-x64.exe — no spaces, so the file survives URLs, scp and
# shells that would otherwise need quoting.
artifactName: Strategy-Desk-${version}-${arch}.${ext}
directories:
  output: release
  # icon.png / icon.ico / icon.icns live here (generated by `npm run icons`);
  # electron-builder picks the right one per platform automatically.
  buildResources: build
files:
  - out/**
  # Everything the app READS AT RUNTIME has to be listed here. It all sits in
  # the working directory during development, so a missing entry costs nothing
  # in dev and ships an app with no workflows (empty «День» panel) and no prop
  # firm rules (empty report cards). src/main/resource-paths.ts holds the
  # matching lookup order.
  - prompt/**       # system-prompt.md — the base system prompt
  - data/**         # prop-firms.json (rule book) + copilot-notes.md (field notes)
  - workflows/**    # workflow.yaml + prompt.md per strategy; the «День» panel
  - package.json
asarUnpack:
  # The Agent SDK spawns a native Claude Code binary (shipped in the platform
  # package @anthropic-ai/claude-agent-sdk-<os>-<arch>); keep it outside asar.
  # The SDK resolves it with require.resolve() from its own location, so both
  # the SDK and the platform package must be unpacked together — and the binary
  # is ~230 MB, which is most of the installer.
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
# tvmcp is NOT bundled: the app runs it as `uv --directory <path> run …`, and
# that path is a setting the first-run wizard fills in. Nothing in this file may
# assume the clone exists.
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false                        # a real wizard, not a silent drop
  perMachine: false                      # per-user install: no UAC prompt
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Strategy Desk
  deleteAppDataOnUninstall: false        # chats, config and journals survive
  differentialPackage: false             # no update server, so no blockmap
mac:
  # Configured but not built here (needs macOS + codesign).
  target:
    - dmg
  category: public.app-category.finance
  icon: build/icon.icns
linux:
  # Configured but not built here.
  target:
    - AppImage
  category: Office
  icon: build/icon.png
# Auto-update is OFF. There is no release channel and no signing certificate,
# so the app never phones home and never offers an update; a new version is a
# new installer. To turn releases on later, drop `publish: null`, uncomment the
# block below, `npm i electron-updater`, and call autoUpdater.checkForUpdates()
# from src/main/index.ts (it needs GH_TOKEN only when publishing, not when
# checking). differentialPackage above must go back to true for delta updates.
#
# publish:
#   provider: github
#   owner: Miha21222
#   repo: strategy-desk
#   releaseType: release        # draft while testing
publish: null
