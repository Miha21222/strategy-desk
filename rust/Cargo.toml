[workspace]
resolver = "2"
members = ["crates/desk-core", "crates/desk-app", "crates/desk-ui", "crates/desk-bench"]

[workspace.package]
version = "0.3.0-dev"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
desk-core = { path = "crates/desk-core" }
desk-app = { path = "crates/desk-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
