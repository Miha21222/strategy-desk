[package]
name = "desk-app"
description = "The impure half: vault watcher, Claude CLI driver (stream-json), tasks, status probes, store, scheduler. Talks to the UI only through commands and snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
desk-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
