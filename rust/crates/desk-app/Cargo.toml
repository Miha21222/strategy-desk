[package]
name = "desk-app"
description = "The impure half: vault watcher, Claude CLI driver (stream-json), tasks, status probes, store, scheduler. Talks to the UI only through commands and snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
desk-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs", "net"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tracing = "0.1"
dirs = "6"
# Windows Credential Manager; off Windows no platform backend is compiled in
# (tests use secrets::MemoryStore).
keyring = { version = "3", default-features = false, features = ["windows-native"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
include_dir = { version = "0.7", optional = true }

[features]
# Compile the vault template in from resources/vault-template (staged by
# scripts/stage-vault.mjs, stage 7). Off: the built-in template is empty.
vault-template = ["dep:include_dir"]

[dev-dependencies]
tempfile = "3"
# The chat integration test runs a fake claude built from QA's stream generator.
desk-bench = { path = "../desk-bench" }
