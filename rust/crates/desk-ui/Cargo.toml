[package]
name = "desk-ui"
description = "The egui window: macro-review screen, gauge, chat, wizard. Renders snapshots, sends commands."
version.workspace = true
edition.workspace = true
# eframe/egui 0.37 need 1.95; the workspace default (1.85) is too old for them.
rust-version = "1.95"
publish.workspace = true

[[bin]]
name = "strategy-desk"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["glow"]
# Exactly one renderer goes into the release binary. Measured 2026-11-25
# (Linux x86_64, release, stripped): glow 7.1 MiB, wgpu 11.3 MiB -> glow.
# Build the other with `--no-default-features --features wgpu`.
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
desk-core.workspace = true
desk-app.workspace = true
anyhow.workspace = true
chrono.workspace = true
# PNG screenshots are decoded off the UI thread; `png` alone, not `image`.
png = "0.18"
# No default features: no system_fonts (scans the OS font dir before the first
# frame), no accesskit/links. `clipboard` since the chat (stage 5): copying an
# answer or a code block, pasting into the composer.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "x11", "wayland", "clipboard"] }
# The chat's Markdown: the parser only (no HTML renderer, no SIMD); the desk
# draws the blocks itself (`chat/markdown.rs`). egui_commonmark was measured
# against it, see the module docs.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
serde_json.workspace = true
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

# Working-set size for `--bench-first-frame` (already in the tree via winit).
[target.'cfg(windows)'.dependencies]
# The native folder picker of «Настройки» and the wizard (IFileOpenDialog).
# Windows only: the desk ships for Windows, and rfd's Linux backends pull in
# GTK or a D-Bus portal stack. Elsewhere the path is typed.
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
