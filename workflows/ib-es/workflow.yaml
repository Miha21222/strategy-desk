# «День IB» — the owner's Initial Balance day on the S&P 500.
# UI labels are Russian, everything the model reads is English.
#
# The `panel` section below is what the APP runs, deterministically, through the
# tvmcp CLI: levels, calendar, risk, and a sentinel run polled on the interval
# the run itself asks for. No model tokens are spent while nothing happens.
# Only the event types in `askModelOn` buy one chat turn.
id: ib-es
title: День IB (US500)
description: >-
  Торговый день по Initial Balance: уровни до открытия, календарь, проверка
  правил риска, сторож сессии 16:30–23:00 (Киев) и вердикт по событиям.
  Приложение считает факты само; модель зовём только на суждение.
promptBlock: prompt.md
shelves: [ib-day, journal]

quickPrompts:
  - id: verdict
    label: Вердикт дня
    prompt: >-
      Day verdict for today. The «День» panel has already fetched the levels,
      the calendar and the risk check — read them from what I paste or ask me for
      them, do not re-fetch. Give me the verdict in three lines (what we do / why /
      what cancels it) and finish with a `workflowstate` block, phase "verdict".
  - id: bias
    label: BIAS на день
    prompt: >-
      Build the daily BIAS for PEPPERSTONE:US500 (analysis reference CME_MINI:ES1!):
      D1 phase, point A (what was taken and rejected), point B (the nearest opposite
      liquidity), the H4/H1 POI and the FTA between A and B, plus the invalidation.
      Use tv_scan_levels / tv_data_get_bars for the facts. Finish with a
      `workflowstate` block, phase "verdict", and say the confidence out loud.
  - id: ethScan
    label: Скан ETH (16:15)
    prompt: >-
      Pre-session ETH scan. Answer the four questions: what the overnight session
      took (ETH high/low, PDH/PDL, daily open), whether that agrees with the BIAS,
      whether the 15:30 news candle left a valid POI, and whether ETH was sideways.
      Then state the RTH bias as confirmed / revised / none, list the manipulation
      levels and the allowed setups. Finish with a `workflowstate` block, phase "eth-scan".
  - id: ibClass
    label: Разбор IB (17:00)
    prompt: >-
      The initial balance has closed. Classify it against ADR(5): wide (> 0.5 ADR),
      medium (1/3 .. 0.5), narrow directional or narrow sideways (< 1/3). Give the
      projections (0.5 / IB1 / IB2), the remaining ADR budget, which setups are still
      allowed and the target plan. Finish with a `workflowstate` block, phase "ib".
  - id: journal
    label: Строка журнала
    prompt: >-
      Write today's journal line: date, verdict, stop reasons, flags, bias, ETH status,
      ADR(5), IB range and class, the manipulation, the signals, whether I entered, the
      result in R, the root cause and the day's fact (RTH high/low, were IB1/IB2/B reached).
      Ask me for the entry facts you cannot know. Keep it short, plain sentences.

reports:
  - id: dayVerdict
    label: Вердикт дня
    prompt: >-
      Day verdict for PEPPERSTONE:US500: calendar layer, context layer, session layer and
      account layer, each either clear or with one named reason. Three lines plus a
      `workflowstate` block, phase "verdict".
  - id: levels
    label: Таблица уровней
    prompt: >-
      Today's level table for PEPPERSTONE:US500 (provider session): previous day high/low/close,
      overnight ETH high/low, daily open, yesterday's RTH high/low, ADR(5) over the RTH session
      and its projections. Emit them as a `chartcard` of type levels, never a markdown table.
  - id: replayReview
    label: Разбор реплея
    prompt: >-
      Review the replayed day from the event feed I paste: did the manipulation, the engulf,
      the range close and the breakout line up with the rules? Say where the rules would have
      kept me out, and whether skipping the day was justified. One `workflowstate` block at the end.
  - id: signalCheck
    label: Проверить сигнал
    prompt: >-
      Check the setup on the table right now: entry, stop (the manipulation extreme minus a
      buffer of 1 tick + 0.02 % of price), TP1 and TP2 with their obstacles, the RR, the valid-until
      time and the cancel conditions. If RR < 1.5 say so and give no recommendation.

panel:
  kind: session-watch
  pollFloorSeconds: 5

  # Handed to tv_sentinel_start; the app adds `day` and `levels`.
  sentinel:
    symbol: PEPPERSTONE:US500
    timeframe: M5
    # The broker CFD lives only on the account feed (opt-in `session` toolset + TV_SESSIONID).
    provider: session
    session:
      start: "16:30"
      end: "23:00"
      tz: Europe/Kyiv
    # The initial balance: 16:30–17:00, i.e. the first six M5 bars of the RTH session.
    range:
      source: session_open
      minutes: 30
    watch:
      breaks: true
      break_range: true
      sweep: true
      levels: true
      stale_bars: 2
      tick_size: 0.1
    # The owner's rule: a breakout counts as held after two consecutive M5 closes
    # outside the range (spec part 3.8). The tool calls the first trade through the
    # boundary BREAK and the held close BREAK_CONFIRMED.
    confirm:
      mode: closes
      closes: 2

  # Handed to tv_scan_levels; its `levels[]` become the sentinel's watched levels.
  levels:
    # `anchors` must be listed, or the Daily open below is never computed.
    include: [prev_day, sessions, anchors, adr, opening_range]
    sessions:
      - {name: ETH, start: "01:00", end: "16:30", tz: Europe/Kyiv}
      - {name: RTH, start: "16:30", end: "23:00", tz: Europe/Kyiv}
      - {name: RTH prev, start: "16:30", end: "23:00", tz: Europe/Kyiv, day_offset: -1}
    anchors:
      - {name: Daily open, time: "01:00", tz: Europe/Kyiv}
    adr_days: 5
    adr_session: RTH
    adr_anchor: session_open
    adr_multiples: [0.5, 1]
    opening_range_session: RTH
    opening_range_minutes: 30
    timeframe: M15
    # The account feed has no end anchor: it returns the LAST `count` bars, so a past
    # date needs enough of them to reach back (M15 ≈ 96 bars a day).
    count: 3000
    provider: session
    tz: Europe/Kyiv

  # Only the liquidity the day's manipulation is measured against; the opening-range
  # levels are the sentinel's own range, so they are not repeated here.
  # Names exactly as tv_scan_levels prints them; anything missing is simply not
  # watched (a feed that returned one level fewer must not take the day down).
  levelNames:
    - Previous day high
    - Previous day low
    - Previous day close
    - ETH high
    - ETH low
    - RTH prev high
    - RTH prev low
    - Daily open

  clocks:
    - {name: verdict, at: "15:45", tz: Europe/Kyiv}
    - {name: eth_scan, at: "16:15", tz: Europe/Kyiv}
    - {name: ib_close, at: "17:00", tz: Europe/Kyiv}
    - {name: entries_closed, at: "18:30", tz: Europe/Kyiv}
    - {name: flat, at: "22:00", tz: Europe/Kyiv}

  # The only events worth a model turn. Everything else the app renders alone.
  askModelOn: [RANGE_CLOSED, BREAK_CONFIRMED, SWEEP, CLOCK]

  calendar:
    countries: [US]
    min_impact: high
    symbol: ES1!

  # today / journal / rules_path come from the settings; nothing numeric lives here.
  # Copy risk-rules.example.json, put YOUR limits in it and point the settings at it.
  risk: {}

  prompts:
    event: >-
      The day panel saw a {event_type} on the US500 initial-balance watch at {event_time}.
      Event: {event_json}
      Run state: {state_json}
      These are observations, not recommendations — the numbers are already measured, do not
      re-fetch them. Judge them against the IB protocol: is this the manipulation, the engulf,
      the range class, the held breakout or just noise? Answer in at most four short lines,
      then one `workflowstate` block with the current phase, the verdict and any signal you can
      actually price (entry, stop, TP1, RR, valid-until). If nothing changes, say so in one line.
    verdict: >-
      Day verdict for the US500 initial-balance day, from the panel's own numbers:
      Run state: {state_json}
      Three lines — what we do, why, what cancels it — then one `workflowstate` block.
    review: >-
      Replay review of {date} on the US500 initial-balance watch.
      Events: {events_json}
      Walk the day against the protocol: what the session took, how the range closed against ADR,
      whether a breakout held, and whether a setup was ever priceable. Say plainly where the rules
      would have kept me out and whether skipping was justified. Finish with one `workflowstate` block.
